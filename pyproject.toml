[project]
name = "razorpay-recovery-agent"
version = "0.1.0"
description = "Consensus-committed UPI Autopay failure recovery agent — Razorpay Hackathon Track 3."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pyyaml>=6.0",
    "etcd3>=0.12",
    "psycopg[binary]>=3.2",
    "streamlit>=1.39",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.115",
]

[tool.pytest.ini_options]
markers = [
    "invariants: the 8 property-test invariants from docs/BUILDER_DOC.md §8 — always run against the prod config profile, never demo",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
