services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recovery
      POSTGRES_PASSWORD: recovery
      POSTGRES_DB: recovery
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recovery"]
      interval: 5s
      timeout: 3s
      retries: 10

  etcd1:
    image: quay.io/coreos/etcd:v3.5.9
    command:
      - etcd
      - --name=etcd1
      - --initial-advertise-peer-urls=http://etcd1:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd1:2379
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=recovery-etcd-cluster
    ports:
      - "2379:2379"

  etcd2:
    image: quay.io/coreos/etcd:v3.5.9
    command:
      - etcd
      - --name=etcd2
      - --initial-advertise-peer-urls=http://etcd2:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd2:2379
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=recovery-etcd-cluster
    ports:
      - "2389:2379"

  etcd3:
    image: quay.io/coreos/etcd:v3.5.9
    command:
      - etcd
      - --name=etcd3
      - --initial-advertise-peer-urls=http://etcd3:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd3:2379
      - --initial-cluster=etcd1=http://etcd1:2380,etcd2=http://etcd2:2380,etcd3=http://etcd3:2380
      - --initial-cluster-state=new
      - --initial-cluster-token=recovery-etcd-cluster
    ports:
      - "2399:2379"

  app1:
    build: .
    environment:
      - CONFIG_PROFILE=demo
      - USE_ETCD=true
      - USE_POSTGRES=true
      - RAZORPAY_WEBHOOK_SECRET=test_secret_123
      - WORKER_ID=1
    depends_on:
      - etcd1
      - etcd2
      - etcd3
      - postgres

  app2:
    build: .
    environment:
      - CONFIG_PROFILE=demo
      - USE_ETCD=true
      - USE_POSTGRES=true
      - RAZORPAY_WEBHOOK_SECRET=test_secret_123
      - WORKER_ID=2
    depends_on:
      - etcd1
      - etcd2
      - etcd3
      - postgres

  app3:
    build: .
    environment:
      - CONFIG_PROFILE=demo
      - USE_ETCD=true
      - USE_POSTGRES=true
      - RAZORPAY_WEBHOOK_SECRET=test_secret_123
      - WORKER_ID=3
    depends_on:
      - etcd1
      - etcd2
      - etcd3
      - postgres

  lb:
    image: nginx:alpine
    ports:
      - "8000:80"
    depends_on:
      - app1
      - app2
      - app3
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

volumes:
  postgres-data: