events {}
http {
    upstream recovery_app {
        server app1:8000;
        server app2:8000;
        server app3:8000;
    }
    server {
        listen 80;
        location / {
            proxy_pass http://recovery_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}