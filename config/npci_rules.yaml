npci_rules:
  max_retries: 3
  notice_lead_time: 24h
  peak_windows:
    - start: "10:00"
      end: "13:00"
    - start: "17:00"
      end: "21:30"
  afa_free_ceiling:
    default: 1500000          # ₹15,000
    insurance: 10000000       # ₹1,00,000
    mutual_fund: 10000000
    credit_card_bill: 10000000

# Our own conservative floors, not sourced from NPCI
self_imposed:
  control_observation_window: 72h
  retry_spacing:
    - 0h
    - 72h
    - 168h
  max_schedule_window: 48h

profiles:
  prod:
    time_scale: 1x
  demo:
    time_scale: 3600x

decline_rules:
  technical:
    - bank_server_down
    - network_timeout
    - upi_timeout
    - issuer_unavailable
    - payment_authorization_failed
  business:
    - insufficient_funds
    - blocked_account
    - invalid_mandate
    - payment_limit_exceeded
    - payment_failed
  default: business

rails:
  upi: 0.65
  card: 0.70
  nach: 0.75